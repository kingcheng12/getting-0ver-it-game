[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getting-over-it-env"
version = "0.1.0"
description = "Gymnasium communication wrapper for the Unity Getting Over It environment"
requires-python = ">=3.8,<3.9"
dependencies = [
    "gymnasium==0.28.1",
    "grpcio==1.53.2",
    "mlagents-envs==0.26.0",
    "numpy==1.23.5",
    "protobuf==3.20.3",
    "torch==2.4.1",
]

[project.scripts]
goi-train = "getting_over_it_rl.train:main"
goi-evaluate = "getting_over_it_rl.evaluate:main"
goi-demo-inspect = "getting_over_it_rl.demo_inspect:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/getting_over_it_env",
    "src/getting_over_it_rl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
